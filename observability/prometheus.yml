global:
  scrape_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ai-data-platform-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
  - job_name: ai-data-platform-consumer
    metrics_path: /metrics
    static_configs:
      - targets: [consumer:8001]
